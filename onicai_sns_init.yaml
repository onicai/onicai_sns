# To simulate SNS params, use the SNS analyzer:
# https://dashboard.internetcomputer.org/sns/tokenomics
#
# ------------------------------------------------------------------------------
# In this file, 1 year is nominally defined to be 365.25 days.
#
# This gets passed to `sns propose`. See propose_sns.sh.
#
# This follows the second configuration file format developed for the `sns`
# CLI.
# ------------------------------------------------------------------------------
# UNITS
#
# This SNS configuration file version allows specifying the various
# fields with units that make configuration easier. For instance,
# in the previous version, all fields relating to token values
# had to be specified in e8s (fractions of 10E-8 of a governance token).
# In this version, similar fields can be specified in whole tokens,
# tokens with decimals, or e8s. Below is more information on the type
# of units that can be used.
#
# For fields that represent token values (such as `transaction_fee`
# or `rejection_fee`), devs can specify decimal strings ending in
# "tokens" (plural), decimal strings ending in "token" (singular),
# or integer strings (base 10) ending in "e8s". In the case of
# "tokens" strings, the maximum number of digits after the (optional)
# decimal point is 8. The "_" character may be sprinkled throughout.
# Whitespace around number is insignificant. E.g. " 42 tokens" is
# equivalent to "42tokens".
#
# For fields that represent duration values (such as `initial_voting_period`
# or `minimum_dissolve_delay`), devs can specify durations as a concatenation
# of time spans. Where each time span is an integer number and a suffix.
# Supported suffixes:
#  - seconds, second, sec, s
#  - minutes, minute, min, m
#  - hours, hour, hr, h
#  - days, day, d
#  - weeks, week, w
#  - months, month, M -- defined as 30.44 days
#  - years, year, y -- defined as 365.25 days
#
# For example, "1w 2d 3h" gets parsed as
#
# 1 week + 2 days + 3 hours
#    =
# (1 * (7 * 24 * 60 * 60) + 2 * 24 * 60 * 60 + 3 * (60 * 60)) seconds
#
# For fields that represent percentage values (such as `bonus`), devs specify
# the value as an integer with a trailing percent sign ('%'). For example,
# `10%`.
#
# For fields that represent time of day (such as `start_time`), devs specify
# the value as a string in form "hh::mm UTC". Where hh is hour, and mm is minute.
# Only the UTC timezone is currently supported.
# ------------------------------------------------------------------------------

# Name of the SNS project. This may differ from the name of the associated
# token. Must be a string of at most 255 bytes.
name: onicai

# Description of the SNS project.
# Must be a string of at most 2,000 bytes.
# This description is used on the ICP Dashboard
# https://dashboard.internetcomputer.org/sns
description: >
    This SNS decentralizes the funnAI application (https://funnai.onicai.com)
    by donating it to the onicai community in a non-diluting manner, with no
    ICP treasury retained. ALL current FUNNAI holders, including the team and
    the funnAI Protocol Treasury, either mAIned their tokens or purchased them
    on ICPSwap. No pre-mint or free grant ever occurred. Post-launch, FUNNAI
    holders migrate their tokens 1:1 to the ONICAI SNS governance token. To
    make the event fully non-diluting, post-launch the team first burns FUNNAI
    equal to the ONICAI in their genesis neurons, and the funnAI Protocol
    Treasury burns FUNNAI equal to the ONICAI sold in the token sale and seeded
    into the liquidity pool, before both migrate whatever FUNNAI they still
    hold. ONICAI will have a hard cap of 21M, and because 449,589 FUNNAI has
    already been burned, only 20,550,411 is created at launch. Everything --
    migration, pool, future mAIning rewards -- comes out of that. No additional
    ONICAI is ever minted. Supply becomes deflationary through burning once
    mAIning ends in 2033. To seed the pool, the ICP from the sale is added to
    the ICP the funnAI Protocol Treasury already holds, and the combined amount
    is matched with SNS treasury ONICAI at the initial price of 1 ONICAI =
    0.0075 ICP. The team's 617,000 genesis ONICAI is not a reward but a
    bootstrap for setting up the SNS. Treasury proposals need a 67%
    supermajority, and 617,000 against the sale's 264,000 is 70.03% --
    comfortably enough to pass the CRITICAL proposals that create the liquidity
    pool and switch mAIning rewards to ONICAI, even if a single hostile buyer
    took the entire sale and voted no. This majority is only temporary: once
    FUNNAI holders have exercised their 1:1 migration, roughly 5,000,000 ONICAI
    is in their hands and the team's holdings become a small minority. Every
    funnAI application feature is preserved, and mAIning continues on the same
    schedule. Further decentralization occurs naturally through mAIning.


