    # Must be a string of 10 to 2,048 bytes.
    # The protocol must be HTTPS, and the domain must be forum.dfinity.org.
    # TODO: create a new forum thread and paste its URL here.
    url: "https://forum.dfinity.org/t/upcoming-onicai-sns-decentralization-swap/61361"

    # The summary of the NNS proposal. The limit is 30,000 bytes
    # (PROPOSAL_SUMMARY_BYTES_MAX). Do NOT confuse it with the 2,000-byte limit
    # on the SNS metadata `description` above (SnsMetadata::MAX_DESCRIPTION_LENGTH).
    # The NNS shows voters this summary, not the description, so it carries the
    # description verbatim plus the parameters a voter needs.
    # TODO before submission: update the forum-post link, and refresh every
    # figure from the final FUNNAI snapshot. Read Minted/Burned/Circulating from
    # https://myfunnai.app/supply, or query the ledger and API canisters
    # directly if you need e8s precision.
    summary: |
        ## onicai SNS
        This SNS decentralizes the funnAI application (https://funnai.onicai.com) by donating
        it to the onicai community in a non-diluting manner, with no ICP treasury retained.
        ALL current FUNNAI holders, including the team and the funnAI Protocol Treasury,
        either mAIned their tokens or purchased them on ICPSwap. No pre-mint or free grant
        ever occurred. Post-launch, FUNNAI holders migrate their tokens 1:1 to the ONICAI SNS
        governance token. To make the event fully non-diluting, post-launch the team first
        burns FUNNAI equal to the ONICAI in their genesis neurons, and the funnAI Protocol
        Treasury burns FUNNAI equal to the ONICAI sold in the token sale and seeded into the
        liquidity pool, before both migrate whatever FUNNAI they still hold. ONICAI will have
        a hard cap of 21M, and because 449,589 FUNNAI has already been burned, only 20,550,411
        is created at launch. Everything -- migration, pool, future mAIning rewards -- comes
        out of that. No additional ONICAI is ever minted. Supply becomes deflationary through
        burning once mAIning ends in 2033. To seed the pool, the ICP from the sale is added to
        the ICP the funnAI Protocol Treasury already holds, and the combined amount is matched
        with SNS treasury ONICAI at the initial price of 1 ONICAI = 0.0075 ICP. The team's
        617,000 genesis ONICAI is not a reward but a bootstrap for setting up the SNS.
        Treasury proposals need a 67% supermajority, and 617,000 against the sale's 264,000 is
        70.03% -- comfortably enough to pass the CRITICAL proposals that create the liquidity
        pool and switch mAIning rewards to ONICAI, even if a single hostile buyer took the
        entire sale and voted no. This majority is only temporary: once FUNNAI holders have
        exercised their 1:1 migration, roughly 5,000,000 ONICAI is in their hands and the
        team's holdings become a small minority. Every funnAI application feature is
        preserved, and mAIning continues on the same schedule. Further decentralization occurs
        naturally through mAIning.

        ## Token
        * Total minted: 20,550,411 ONICAI
        * Transaction fee: 0.1 ONICAI | Proposal rejection fee: 1,000 ONICAI
        * Neurons' Fund participation: No

        The cap is 21M. 449,589 FUNNAI is already burned, so only 20,550,411 ONICAI is created 
        at launch.

        ## Genesis Distribution (20,550,411 ONICAI)
        * Team neurons: 617,000 (1.22% + 1.22% + 0.41% + 0.16% across 4 members)
        * Advisor neurons (Outlier Ventures): 420,000 (2.04%)
        * Token sale for Liquidity Pool seeding: 264,000 (1.28%)
        * SNS treasury: 19,249,411 (93.67%)

        ## Token Sale for Liquidity Pool seeding
        * Minimum 5 participants; 4 ICP minimum and 250 ICP maximum each
        * ICP collected: minimum 20 ICP, maximum 1,980 ICP
        * 264,000 ONICAI is sold
        * Each participant receives a basket of 6 neurons of equal stake, with dissolve delays
          of 0, 1, 2, 3, 4 and 5 months

        ## Liquidity Pool
        * The ICP collected, plus the ICP the funnAI Protocol Treasury already holds, is paired
          with SNS treasury ONICAI on ICPSwap at that same 0.0075
        * The Treasury burns matching FUNNAI

        ## Non-diluting
        The team's 617,000 ONICAI, the sale's 264,000 ONICAI and the ONICAI seeded into the
        liquidity pool are all matched 1:1 by FUNNAI to be burned post-launch -- the team's
        own, and the protocol's own -- so none of these events adds to circulating supply and
        it is non-diluting for existing FUNNAI holders.

        ## Voting
        * Minimum dissolve delay to vote: 1 month
        * Dissolve delay bonus: 0% -- holding, not locking, is rewarded
        * Age bonus: 100% over 4 years
        * Voting reward rate: 0% -- no ONICAI inflation
        * Initial voting period 4 days, wait-for-quiet extension 1 day

        ## Post-Genesis Distribution (via SNS proposals)
        The treasury will be fully disbursed: 4,971,962 shared between the liquidity pool and
        1:1 FUNNAI holder redemption, and 14,277,449 to the GameState canister for mAIning
        rewards.

